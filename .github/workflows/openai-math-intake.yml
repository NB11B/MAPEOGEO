name: Complete OpenAI math source intake

on:
  workflow_dispatch:
    inputs:
      full_intake:
        description: Reconstruct foundation and ingest the entire pinned source repository
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - "mapeogeo/openai_math_source.py"
      - "scripts/openai_math_intake.py"
      - "scripts/verify_openai_math_intake.py"
      - "scripts/reconstruct_pipeline.py"
      - "formal/openai_math_source_pin.json"
      - "tests/test_openai_math_*.py"
      - "requirements-openai-math-intake.txt"
      - ".github/workflows/openai-math-intake.yml"
  push:
    paths:
      - "mapeogeo/openai_math_source.py"
      - "scripts/openai_math_intake.py"
      - "scripts/verify_openai_math_intake.py"
      - "scripts/reconstruct_pipeline.py"
      - "formal/openai_math_source_pin.json"
      - "tests/test_openai_math_*.py"
      - "requirements-openai-math-intake.txt"
      - ".github/workflows/openai-math-intake.yml"

permissions:
  contents: read

jobs:
  source-independent-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout MAPEOGEO
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-openai-math-intake.txt
      - name: Install intake and fixture dependencies
        run: python -m pip install -r requirements-openai-math-intake.txt
      - name: Run source-independent intake and integrity tests
        run: >-
          python -m pytest -q tests/test_openai_math_*.py
          tests/test_source_importer.py tests/test_reconstruction_integrity.py
          tests/test_source_count_integrity.py

  complete-intake:
    needs: source-independent-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENAI_MATH_COMMIT: adc7f1241b42e322a6451854ab7e4b4c146bf78a
    steps:
      - name: Checkout MAPEOGEO
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-openai-math-intake.txt
      - name: Install intake dependencies
        run: python -m pip install -r requirements-openai-math-intake.txt
      - name: Fetch exact source revision outside the project checkout
        shell: bash
        run: |
          set -euo pipefail
          source_checkout="$RUNNER_TEMP/openai-math-source"
          git init "$source_checkout"
          git -C "$source_checkout" remote add origin https://github.com/openai/math.git
          git -C "$source_checkout" fetch --depth 1 origin "$OPENAI_MATH_COMMIT"
          git -C "$source_checkout" checkout --detach FETCH_HEAD
          test "$(git -C "$source_checkout" rev-parse HEAD)" = "$OPENAI_MATH_COMMIT"
      - name: Reconstruct foundation and ingest complete source corpus
        run: >-
          python scripts/reconstruct_pipeline.py --target-stage openai-math
          --openai-math-source "$RUNNER_TEMP/openai-math-source"
      - name: Independently verify the complete graph and source corpus
        run: >-
          python scripts/verify_openai_math_intake.py
          --source-repo "$RUNNER_TEMP/openai-math-source"
          --base-graph artifacts/foundation_backfill/mapeogeo_foundation_graph.json.gz
          --graph artifacts/openai_math/mapeogeo_openai_math_graph.json.gz
          --manifest artifacts/openai_math/source_manifest.json.gz
          --report artifacts/openai_math/intake_report.json
          --output artifacts/openai_math_verification.json
      - name: Finalize canonical reconciliation classification
        run: >-
          python scripts/finalize_openai_math_reconciliation.py
          --graph artifacts/openai_math/mapeogeo_openai_math_graph.json.gz
          --registry formal/cross_source_alignments_v0_19.json
          --output artifacts/openai_math/canonical_reconciliation_final.json
      - name: Run persisted PSMSL-FQ E8R/E9R recovery continuation
        run: >-
          python experiments/psmsl_fq_e8e9_recovery.py
          --graph artifacts/openai_math/mapeogeo_openai_math_graph.json.gz
          --output artifacts/openai_math/psmsl_fq_e8e9_recovery.json
      - name: Split qualified graph below connector ceiling
        shell: bash
        run: |
          set -euo pipefail
          graph=artifacts/openai_math/mapeogeo_openai_math_graph.json.gz
          mkdir -p artifacts/openai_math_parts
          split -b 350M -d -a 2 "$graph" artifacts/openai_math_parts/graph.part.
          sha256sum "$graph" > artifacts/openai_math_parts/graph.sha256
          sha256sum artifacts/openai_math_parts/graph.part.* > artifacts/openai_math_parts/parts.sha256
          cat > artifacts/openai_math_parts/assemble.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          sha256sum -c parts.sha256
          cat graph.part.* > mapeogeo_openai_math_graph.json.gz
          expected=$(awk '{print $1}' graph.sha256)
          actual=$(sha256sum mapeogeo_openai_math_graph.json.gz | awk '{print $1}')
          test "$expected" = "$actual"
          echo "$actual  mapeogeo_openai_math_graph.json.gz"
          EOF
          chmod +x artifacts/openai_math_parts/assemble.sh
      - name: Upload graph part 00
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-openai-math-graph-part-00
          path: artifacts/openai_math_parts/graph.part.00
          compression-level: 0
      - name: Upload graph part 01
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-openai-math-graph-part-01
          path: artifacts/openai_math_parts/graph.part.01
          compression-level: 0
      - name: Upload graph assembly metadata
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-openai-math-graph-assembly
          path: |
            artifacts/openai_math_parts/graph.sha256
            artifacts/openai_math_parts/parts.sha256
            artifacts/openai_math_parts/assemble.sh
      - name: Upload merged graph and intake evidence
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-openai-math-${{ env.OPENAI_MATH_COMMIT }}
          path: |
            artifacts/openai_math/mapeogeo_openai_math_graph.json.gz
            artifacts/openai_math/intake_report.json
            artifacts/openai_math/source_manifest.json.gz
            artifacts/openai_math_verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
