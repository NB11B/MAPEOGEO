name: work-router-v0-1

on:
  push:
    branches: [main, work-router-v0.1]
    paths:
      - "mapeogeo/work_router.py"
      - "tests/test_work_router_v0_1.py"
      - "docs/WORK_ROUTER_V0_1.md"
      - ".github/workflows/work-router-v0-1.yml"
  pull_request:
    paths:
      - "mapeogeo/work_router.py"
      - "tests/test_work_router_v0_1.py"
      - "docs/WORK_ROUTER_V0_1.md"
      - ".github/workflows/work-router-v0-1.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Router tests
        run: python -m pytest tests/test_work_router_v0_1.py -q
      - name: Existing semantic-contract tests
        run: python -m pytest tests/test_semantic_contracts_v03.py -q
