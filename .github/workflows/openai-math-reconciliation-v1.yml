name: OpenAI math canonical reconciliation candidates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "experiments/openai_math_reconciliation_v1.py"
      - ".github/workflows/openai-math-reconciliation-v1.yml"

permissions:
  contents: read

jobs:
  reconcile-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Fetch frozen source
        run: |
          src="$RUNNER_TEMP/openai-math"
          git init "$src"
          git -C "$src" remote add origin https://github.com/openai/math.git
          git -C "$src" fetch --depth 1 origin adc7f1241b42e322a6451854ab7e4b4c146bf78a
          git -C "$src" checkout --detach FETCH_HEAD
      - name: Generate candidates without promotion
        run: |
          python experiments/openai_math_reconciliation_v1.py \
            --source-repo "$RUNNER_TEMP/openai-math" \
            --alignments formal/cross_source_alignments_v0_12.json \
            --output artifacts/openai_math_reconciliation_candidates_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: openai-math-reconciliation-candidates-v1
          path: artifacts/openai_math_reconciliation_candidates_v1.json
