name: GEO-PRIME cyclic geometry qualification
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['experiments/geo_prime_universal_001/**','.github/workflows/geo-prime-universal.yml']
  pull_request:
    paths: ['experiments/geo_prime_universal_001/**','.github/workflows/geo-prime-universal.yml']
jobs:
  finite-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd experiments/geo_prime_universal_001
          python -m unittest discover -v
          python experiment.py
