name: GEO-PRIME universal cyclic Lean
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['MAPEOGEOFormal/GeoPrimeCycle.lean','.github/workflows/geo-prime-cycle-lean.yml']
  pull_request:
    paths: ['MAPEOGEOFormal/GeoPrimeCycle.lean','.github/workflows/geo-prime-cycle-lean.yml']
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - run: lake build MAPEOGEOFormal.GeoEuler MAPEOGEOFormal.GeoEulerPrime
      - run: lake env lean MAPEOGEOFormal/GeoPrimeCycle.lean
