name: GEO-PRIME spectral partial inference
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['experiments/geo_prime_spectral_partial_001/**','.github/workflows/geo-prime-spectral-partial.yml']
  pull_request:
    paths: ['experiments/geo_prime_spectral_partial_001/**','.github/workflows/geo-prime-spectral-partial.yml']
jobs:
  spectral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd experiments/geo_prime_spectral_partial_001
          python -m unittest discover -v
