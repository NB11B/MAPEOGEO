name: GEO-EULER successor qualification
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['experiments/geo_euler_002/**', '.github/workflows/geo-euler-successor.yml']
  pull_request:
    paths: ['experiments/geo_euler_002/**', '.github/workflows/geo-euler-successor.yml']
jobs:
  successor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd experiments/geo_euler_002
          python -m unittest discover -v
          python experiment.py
