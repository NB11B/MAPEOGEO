name: MAPEOGEO v0.6 independent dual view

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/independent_dual_view_v0_6.py"
      - "scripts/independent_dual_view_v0_6_impl.py.gz"
      - "scripts/corpus_dualize_v0_5.py"
      - "scripts/corpus_dualize_v0_5_impl.py.gz"
      - "tests/test_independent_dual_view_v0_6.py"
      - "tests/validate_independent_dual_view_v0_6.py"
      - "requirements-corpus-dualization.txt"
      - "docs/V0_6_INDEPENDENT_DUAL_VIEW_SPEC.md"
      - "data/gallier_quaintance_graph_v0_3.json.gz"
      - ".github/workflows/independent-dual-view.yml"

permissions:
  contents: read

env:
  SOURCE_URL: https://www.cis.upenn.edu/~jean/math-deep.pdf

jobs:
  independent-dual-view:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-corpus-dualization.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-corpus-dualization.txt

      - name: Run independent-view unit tests
        run: python -m pytest -q tests/test_independent_dual_view_v0_6.py

      - name: Download reference PDF transiently
        run: |
          mkdir -p "$RUNNER_TEMP/mapeogeo-source"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "$SOURCE_URL" \
            -o "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"
          test -s "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"

      - name: Run preregistered v0.6 independent audit
        run: |
          rm -rf artifacts/independent_dual_view_v0_6
          python scripts/independent_dual_view_v0_6.py \
            "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf" \
            --base-graph data/gallier_quaintance_graph_v0_3.json.gz \
            --out-dir artifacts/independent_dual_view_v0_6 \
            --min-declarations 1355 \
            --min-definitions 463 \
            --min-proofs 609 \
            --min-resolved-deps 638 \
            --max-unresolved-rate 0.0938 \
            --min-eo-direct 0.70 \
            --min-geo-direct 0.70 \
            --min-dual-direct 0.60 \
            --max-no-direct 0.15 \
            --max-permutation-p 0.05

      - name: Validate v0.6 artifacts and copyright boundary
        run: python tests/validate_independent_dual_view_v0_6.py artifacts/independent_dual_view_v0_6

      - name: Remove transient source PDF
        if: always()
        run: rm -f "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"

      - name: Upload derived v0.6 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-independent-dual-view-v0.6
          path: artifacts/independent_dual_view_v0_6/
          if-no-files-found: error
          retention-days: 30
