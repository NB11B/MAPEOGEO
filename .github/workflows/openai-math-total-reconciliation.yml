name: OpenAI math total canonical reconciliation
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/resolve_openai_math_canonical_v2.py"
      - ".github/workflows/openai-math-total-reconciliation.yml"
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Fetch exact OpenAI/math revision
        run: |
          src="$RUNNER_TEMP/openai-math"
          git init "$src"
          git -C "$src" remote add origin https://github.com/openai/math.git
          git -C "$src" fetch --depth 1 origin adc7f1241b42e322a6451854ab7e4b4c146bf78a
          git -C "$src" checkout --detach FETCH_HEAD
      - name: Resolve all canonical dispositions
        run: |
          python scripts/resolve_openai_math_canonical_v2.py \
            --source-repo "$RUNNER_TEMP/openai-math" \
            --registry formal/cross_source_alignments_v0_19.json \
            --output artifacts/openai_math_total_reconciliation_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: openai-math-total-reconciliation-v2
          path: artifacts/openai_math_total_reconciliation_v2.json
