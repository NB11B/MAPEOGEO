name: MAPEOGEO v0.13 Tri-Source Mathematics Expansion

on:
  workflow_dispatch:
  push:
    branches: [main, agent/math-expansion-v0-13]
    paths:
      - "formal/tri_source_alignments_v0_13.json"
      - "evidence/v0_13_preregistration.json"
      - "scripts/import_vmls_v0_13.py"
      - "scripts/blinded_alignment_benchmark_v0_13.py"
      - "scripts/tri_source_intake_v0_13.py"
      - "tests/test_tri_source_v0_13.py"
      - "tests/validate_tri_source_v0_13.py"
      - "docs/V0_13_TRI_SOURCE_EXPANSION_SPEC.md"
      - ".github/workflows/tri-source-v0-13.yml"
  pull_request:
    branches: [main]
    paths:
      - "formal/tri_source_alignments_v0_13.json"
      - "evidence/v0_13_preregistration.json"
      - "scripts/import_vmls_v0_13.py"
      - "scripts/blinded_alignment_benchmark_v0_13.py"
      - "scripts/tri_source_intake_v0_13.py"
      - "tests/test_tri_source_v0_13.py"
      - "tests/validate_tri_source_v0_13.py"
      - "docs/V0_13_TRI_SOURCE_EXPANSION_SPEC.md"
      - ".github/workflows/tri-source-v0-13.yml"

permissions:
  contents: read

jobs:
  tri-source-v0-13:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-map-goal-v0-7.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pytest

      - name: Python compilation checks
        run: |
          python -m py_compile scripts/import_vmls_v0_13.py
          python -m py_compile scripts/blinded_alignment_benchmark_v0_13.py
          python -m py_compile scripts/tri_source_intake_v0_13.py
          python -m py_compile tests/test_tri_source_v0_13.py
          python -m py_compile tests/validate_tri_source_v0_13.py

      - name: Reconstruct mathematical dependency chain through v0.12
        run: |
          python scripts/reconstruct_pipeline.py --target-stage v0.12

      - name: Run Pytest test suite
        run: |
          pytest tests/test_tri_source_v0_13.py -v

      - name: Run Blinded Alignment Benchmark
        run: |
          python scripts/blinded_alignment_benchmark_v0_13.py

      - name: Run v0.13 Tri-Source Expansion Intake
        run: |
          python scripts/tri_source_intake_v0_13.py \
            --alignments formal/tri_source_alignments_v0_13.json \
            --preregistration evidence/v0_13_preregistration.json \
            --out-dir artifacts/tri_source_v0_13

      - name: Validate v0.13 Artifacts and Boundaries
        run: |
          python tests/validate_tri_source_v0_13.py artifacts/tri_source_v0_13

      - name: Upload v0.13 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-v0-13-tri-source-artifacts
          path: artifacts/tri_source_v0_13/
