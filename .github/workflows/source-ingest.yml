name: MAPEOGEO source ingest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/import_math_deep.py"
      - "scripts/import_math_deep_impl.py.gz"
      - "tests/test_source_importer.py"
      - "tests/validate_source_ingest.py"
      - "requirements-source-ingest.txt"
      - "data/gallier_quaintance_graph_v0_3.json.gz"
      - ".github/workflows/source-ingest.yml"

permissions:
  contents: read

env:
  SOURCE_URL: https://www.cis.upenn.edu/~jean/math-deep.pdf

jobs:
  source-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install source-ingestion dependencies
        run: python -m pip install -r requirements-source-ingest.txt

      - name: Run importer unit tests
        run: python -m pytest -q tests/test_source_importer.py

      - name: Download reference PDF transiently
        run: |
          mkdir -p "$RUNNER_TEMP/mapeogeo-source"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "$SOURCE_URL" \
            -o "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"
          test -s "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"

      - name: Run full source ingestion
        run: |
          rm -rf artifacts/source_ingest
          python scripts/import_math_deep.py \
            "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf" \
            --base-graph data/gallier_quaintance_graph_v0_3.json.gz \
            --out-dir artifacts/source_ingest \
            --min-declarations 100 \
            --min-chapters 30

      - name: Validate generated graph and copyright boundary
        run: python tests/validate_source_ingest.py artifacts/source_ingest

      - name: Remove transient source PDF
        if: always()
        run: rm -f "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"

      - name: Upload derived source-ingestion evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-source-ingest-v0.4
          path: artifacts/source_ingest/
          if-no-files-found: error
          retention-days: 30
