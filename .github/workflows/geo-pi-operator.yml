name: GEO-PI operator expression controls
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['experiments/geo_pi_operator_001/**','.github/workflows/geo-pi-operator.yml']
  pull_request:
    paths: ['experiments/geo_pi_operator_001/**','.github/workflows/geo-pi-operator.yml']
jobs:
  arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd experiments/geo_pi_operator_001
          python -m unittest discover -v
          python experiment.py
