name: MAPEOGEO v0.7 MAP goal audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/map_goal_v0_7.py"
      - "scripts/map_goal_v0_7_impl.py.gz"
      - "tests/test_map_goal_v0_7.py"
      - "tests/validate_map_goal_v0_7.py"
      - "docs/V0_7_MAP_GOAL_SPEC.md"
      - "requirements-map-goal-v0-7.txt"
      - ".github/workflows/map-goal-v0-7.yml"

permissions:
  contents: read

env:
  SOURCE_URL: https://www.cis.upenn.edu/~jean/math-deep.pdf

jobs:
  map-goal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-map-goal-v0-7.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-map-goal-v0-7.txt
      - name: Run v0.7 unit tests
        run: python -m pytest -q tests/test_map_goal_v0_7.py
      - name: Download reference PDF transiently
        run: |
          mkdir -p "$RUNNER_TEMP/mapeogeo-source"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "$SOURCE_URL" -o "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"
          test -s "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"
      - name: Regenerate frozen v0.6 representation
        run: |
          rm -rf "$RUNNER_TEMP/mapeogeo-v06"
          python scripts/independent_dual_view_v0_6.py \
            "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf" \
            --base-graph data/gallier_quaintance_graph_v0_3.json.gz \
            --out-dir "$RUNNER_TEMP/mapeogeo-v06" \
            --min-declarations 1355 \
            --min-definitions 463 \
            --min-proofs 609 \
            --min-resolved-deps 638 \
            --max-unresolved-rate 0.0938 \
            --min-eo-direct 0.70 \
            --min-geo-direct 0.70 \
            --min-dual-direct 0.60 \
            --max-no-direct 0.15 \
            --max-permutation-p 0.05
      - name: Run preregistered v0.7 MAP goal audit
        run: |
          rm -rf artifacts/map_goal_v0_7
          python scripts/map_goal_v0_7.py \
            "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf" \
            --v06-dir "$RUNNER_TEMP/mapeogeo-v06" \
            --out-dir artifacts/map_goal_v0_7 \
            --min-holdout-edges 100 \
            --min-dual-filter-recall 0.75 \
            --min-dual-filter-reduction 0.20 \
            --max-retrieval-p 0.05 \
            --min-same-semantics-promotions 2 \
            --min-total-certificates 4
      - name: Validate v0.7 artifact and copyright boundary
        run: python tests/validate_map_goal_v0_7.py artifacts/map_goal_v0_7
      - name: Remove transient source PDF
        if: always()
        run: rm -f "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"
      - name: Upload derived v0.7 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-map-goal-v0.7
          path: artifacts/map_goal_v0_7/
          if-no-files-found: error
          retention-days: 30
