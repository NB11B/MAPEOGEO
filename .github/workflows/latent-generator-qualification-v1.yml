name: latent-generator-qualification-v1
on:
  push:
    branches: [latent-generator-qualification-v1]
  pull_request:
    paths:
      - "mapeogeo/latent_generator_v1.py"
      - "mapeogeo/latent_generator_domains_v1.py"
      - "mapeogeo/latent_generator_qualification_v1.py"
      - "tests/test_latent_generator_v1.py"
      - "tests/test_latent_generator_domains_v1.py"
      - "tests/test_latent_generator_qualification_v1.py"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_latent_generator_v1.py tests/test_latent_generator_domains_v1.py tests/test_latent_generator_qualification_v1.py -q
      - run: python -m pytest tests/test_work_router_contract_composition_v0_9.py tests/test_gfyproof_endpoint_contracts_v03.py -q
