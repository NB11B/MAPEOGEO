name: work-router-real-pa-v0-1

on:
  push:
    branches: [work-router-real-pa-v0.1]
  pull_request:
    paths:
      - "mapeogeo/work_router.py"
      - "mapeogeo/pa_condition_monitor.py"
      - "scripts/qualify_work_router_real_pa.py"
      - "tests/test_work_router_real_pa.py"
      - "tests/test_pa_condition_monitor.py"
      - ".github/workflows/work-router-real-pa-v0-1.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_work_router_v0_1.py tests/test_work_router_real_pa.py tests/test_pa_condition_monitor.py -q
      - run: python -m pytest tests/test_gfyproof_endpoint_contracts_v03.py -q
