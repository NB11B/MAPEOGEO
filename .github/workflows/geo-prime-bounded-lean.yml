name: GEO-PRIME bounded operational Lean
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['MAPEOGEOFormal/GeoPrimeBoundedOrbit.lean','MAPEOGEOFormal/GeoPrimeOrbitNegative.lean','.github/workflows/geo-prime-bounded-lean.yml']
  pull_request:
    paths: ['MAPEOGEOFormal/GeoPrimeBoundedOrbit.lean','MAPEOGEOFormal/GeoPrimeOrbitNegative.lean','.github/workflows/geo-prime-bounded-lean.yml']
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - run: lake build MAPEOGEOFormal.GeoEuler MAPEOGEOFormal.GeoEulerPrime MAPEOGEOFormal.GeoPrimeCycle MAPEOGEOFormal.GeoPrimeOrbit MAPEOGEOFormal.GeoPrimeOrbitCoprime
      - run: lake build MAPEOGEOFormal.GeoPrimeBoundedOrbit
      - run: lake env lean MAPEOGEOFormal/GeoPrimeOrbitNegative.lean
