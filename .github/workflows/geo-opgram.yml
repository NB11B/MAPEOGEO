name: GEO-OPGRAM finite black-box operational grammar
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['experiments/geo_opgram_001/**','.github/workflows/geo-opgram.yml']
  pull_request:
    paths: ['experiments/geo_opgram_001/**','.github/workflows/geo-opgram.yml']
jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd experiments/geo_opgram_001
          python -m unittest discover -v
          python experiment.py
