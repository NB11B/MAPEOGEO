name: Post-Hardening Proof Replay Audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest numpy pandas sympy scipy pymupdf
      - name: Run bridge hardening and post-hardening audit
        run: |
          python -m pytest -q \
            tests/test_gfyproof_bridge.py \
            tests/audit/test_gfyproof_ingestion_known_gap.py \
            tests/audit/test_post_hardening_proof_replay_gap.py
