name: Full held-out #312 invariance experiment

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "experiments/result_312_full/**"
      - ".github/workflows/result-312-full-heldout.yml"

permissions:
  contents: read

jobs:
  full-heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENAI_MATH_COMMIT: adc7f1241b42e322a6451854ab7e4b4c146bf78a
      BASELINE_GRAPH_SHA256: abe9c19bcce1281f7b285bfe11f7051d5dc38fb9ca3072a32a4b44def72f43b9
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-openai-math-intake.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-openai-math-intake.txt

      - name: Fetch exact frozen OpenAI/math revision
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/openai-math"
          git init "$src"
          git -C "$src" remote add origin https://github.com/openai/math.git
          git -C "$src" fetch --depth 1 origin "$OPENAI_MATH_COMMIT"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$OPENAI_MATH_COMMIT"

      - name: Reconstruct exact frozen integrated graph
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconstruct_pipeline.py --target-stage openai-math --openai-math-source "$RUNNER_TEMP/openai-math"
          echo "$BASELINE_GRAPH_SHA256  artifacts/openai_math/mapeogeo_openai_math_graph.json.gz" | sha256sum -c -

      - name: Execute full held-out experiment
        id: experiment
        shell: bash
        run: |
          set +e
          python -m experiments.result_312_full.campaign             --graph artifacts/openai_math/mapeogeo_openai_math_graph.json.gz             --source-repo "$RUNNER_TEMP/openai-math"             --registry formal/cross_source_alignments_v0_19.json             --output-dir artifacts/result_312_full_holdout
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print complete result
        if: always()
        shell: bash
        run: |
          cat artifacts/result_312_full_holdout/FULL_HELDOUT_312_REPORT.md || true
          cat artifacts/result_312_full_holdout/result.json || true

      - name: Upload held-out experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-312-full-heldout
          path: artifacts/result_312_full_holdout/
          if-no-files-found: error

      - name: Enforce experiment verdict
        if: always()
        shell: bash
        run: test "${{ steps.experiment.outputs.code }}" = "0"
