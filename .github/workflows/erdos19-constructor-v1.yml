name: erdos19-constructor-v1
on:
  push:
    branches: [erdos19-constructor-v1]
  pull_request:
    paths:
      - "mapeogeo/erdos19_constructor.py"
      - "mapeogeo/erdos19_structure.py"
      - "tests/test_erdos19_constructor_v1.py"
      - "tests/test_erdos19_structure_v1.py"
      - ".github/workflows/erdos19-constructor-v1.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_erdos19_constructor_v1.py tests/test_erdos19_structure_v1.py tests/test_erdos_proof_shapes_v3.py tests/test_erdos_formal_obligations_v2.py -q
      - run: python -m pytest tests/test_gfyproof_endpoint_contracts_v03.py -q
