name: MAPEOGEO v0.22 Wave F5 (Functional Analysis, Operators & ODE Flows)

on:
  workflow_dispatch:
  push:
    branches:
      - agent/math-coverage-wave-f5-design-v0-22
      - main
    paths:
      - "MAPEOGEOFormal.lean"
      - "MAPEOGEOFormal/**"
      - "data/**"
      - "docs/**"
      - "formal/wave_f5/**"
      - "mapeogeo/wave_f5/**"
      - "schema/wave-f5-*.schema.json"
      - "scripts/**"
      - "tests/wave_f5/**"
      - ".github/workflows/wave-f5-v0-22.yml"

permissions:
  contents: read

jobs:
  wave-f5-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"

      - name: Install dependencies
        run: |
          python -m pip install pytest jsonschema numpy scipy

      - name: Verify Baseline Graph Hash Invariant
        run: |
          python -c "import hashlib; h = hashlib.sha256(open('data/mapeogeo_v0_11_graph.json.gz', 'rb').read()).hexdigest(); assert h == '409a648d8563bc4a027dc3dc29fc53722d11bc489462a0f3d1f71bd4f272544d', f'Hash mismatch: {h}'"

      - name: Run Wave F5 Test Suite
        run: |
          pytest tests/wave_f5 -v

      - name: Run Wave F5 Clean-Room Pipeline Reconstructor
        run: |
          python scripts/reconstruct_pipeline.py --target-stage wave_f5
