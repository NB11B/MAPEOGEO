name: GEO-PRIME relational qualification
on:
  pull_request:
    paths:
      - 'experiments/geo_prime_001/**'
      - '.github/workflows/geo-prime.yml'
  push:
    branches: ['experiments/geo-bsl-001']
    paths:
      - 'experiments/geo_prime_001/**'
      - '.github/workflows/geo-prime.yml'
jobs:
  relation-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Operator-order primality and closure tests
        run: python experiments/geo_prime_001/test_prime_relations.py
