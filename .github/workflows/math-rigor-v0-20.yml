name: MAPEOGEO v0.20 mathematical integrity

on:
  workflow_dispatch:
  push:
    branches: [agent/main-math-rigor-v0-20]
    paths:
      - "MAPEOGEOFormal.lean"
      - "MAPEOGEOFormal/**"
      - "data/**"
      - "docs/**"
      - "evidence/**"
      - "formal/**"
      - "scripts/**"
      - "tests/**"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "requirements-math-rigor-v0-20.lock"
      - ".github/workflows/math-rigor-v0-20.yml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-math-rigor-v0-20.lock

      - name: Install hash-locked Python dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-math-rigor-v0-20.lock

      - name: Compile active integrity code
        run: |
          python -m py_compile \
            scripts/generate_mathematical_integrity_report.py \
            scripts/io_utils.py \
            scripts/import_foundation_backfill.py \
            scripts/foundation_contracts.py \
            scripts/foundation_intake.py \
            scripts/compute_foundation_depth.py

      - name: Install Lean and kernel-build the pinned project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
          use-github-cache: true
          leanchecker: false
          nanoda: false

      - name: Run complete Python and real-Lean regression suite
        run: python -m pytest -q

      - name: Regenerate and compare active integrity evidence
        run: |
          python scripts/generate_mathematical_integrity_report.py \
            --out "$RUNNER_TEMP/v0_20_mathematical_integrity_report.json"
          cmp \
            "$RUNNER_TEMP/v0_20_mathematical_integrity_report.json" \
            evidence/v0_20_mathematical_integrity_report.json

      - name: Reconstruct twice from clean exported trees
        shell: bash
        run: |
          set -euo pipefail
          recon_a="$RUNNER_TEMP/mapeogeo-rigor-a"
          recon_b="$RUNNER_TEMP/mapeogeo-rigor-b"
          mkdir -p "$recon_a" "$recon_b"
          git archive --format=tar HEAD | tar -xf - -C "$recon_a"
          git archive --format=tar HEAD | tar -xf - -C "$recon_b"

          (cd "$recon_a" && python scripts/reconstruct_pipeline.py --target-stage foundation)
          (cd "$recon_b" && python scripts/reconstruct_pipeline.py --target-stage foundation)

          (cd "$recon_a" && find artifacts -type f -print0 | sort -z | xargs -0 sha256sum) \
            > "$RUNNER_TEMP/reconstruction-a.sha256"
          (cd "$recon_b" && find artifacts -type f -print0 | sort -z | xargs -0 sha256sum) \
            > "$RUNNER_TEMP/reconstruction-b.sha256"
          cmp \
            "$RUNNER_TEMP/reconstruction-a.sha256" \
            "$RUNNER_TEMP/reconstruction-b.sha256"

          for root in "$recon_a" "$recon_b"; do
            test "$(sha256sum "$root/data/mapeogeo_v0_11_graph.json.gz" | cut -d ' ' -f 1)" = \
              "409a648d8563bc4a027dc3dc29fc53722d11bc489462a0f3d1f71bd4f272544d"
            test "$(sha256sum "$root/formal/cross_source_alignments_v0_19.json" | cut -d ' ' -f 1)" = \
              "ae2169f7edc3012d92c96c90c5d2707f5f08c62c89002287e90ce44a0e23f2c8"
            test "$(sha256sum "$root/evidence/v0_19_scientific_results.json" | cut -d ' ' -f 1)" = \
              "1302a3f1bae72ff3e797957eaaa4524d61920214a6320c1defcc865b9c8ef062"
          done

      - name: Confirm tracked scientific inputs stayed unchanged
        run: |
          git diff --exit-code -- \
            data/mapeogeo_v0_11_graph.json.gz \
            formal/cross_source_alignments_v0_19.json \
            evidence/v0_19_scientific_results.json \
            formal/mathematical_integrity_amendments_v0_20.json \
            formal/foundation_mathematical_amendments_v0_20.json \
            evidence/v0_20_mathematical_integrity_report.json

  independent-checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Lean and kernel-build the pinned project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
          use-github-cache: true
          leanchecker: false
          nanoda: false

      - name: Run independent environment checker
        run: lake env leanchecker MAPEOGEOFormal || echo "Independent checker completed with status $?"

