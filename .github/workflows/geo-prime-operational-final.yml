name: GEO-PRIME end-to-end operational theorem
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['MAPEOGEOFormal/GeoPrimeOrbit*.lean','MAPEOGEOFormal/GeoPrimeOperationalPrime.lean','.github/workflows/geo-prime-operational-final.yml']
  pull_request:
    paths: ['MAPEOGEOFormal/GeoPrimeOrbit*.lean','MAPEOGEOFormal/GeoPrimeOperationalPrime.lean','.github/workflows/geo-prime-operational-final.yml']
jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - run: lake build MAPEOGEOFormal.GeoEuler MAPEOGEOFormal.GeoEulerPrime MAPEOGEOFormal.GeoPrimeCycle MAPEOGEOFormal.GeoPrimeOrbit MAPEOGEOFormal.GeoPrimeOrbitCoprime
      - run: lake env lean MAPEOGEOFormal/GeoPrimeOperationalPrime.lean
