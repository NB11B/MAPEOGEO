name: MAPEOGEO v0.15.1 Confirmatory Real Analysis Expansion Replay

on:
  workflow_dispatch:
  push:
    branches: [main, agent/math-expansion-v0-15-1]
    paths:
      - "formal/analysis_alignments_v0_15.json"
      - "evidence/v0_15_1_preregistration.json"
      - "scripts/import_analysis_v0_15.py"
      - "scripts/analysis_intake_v0_15_1.py"
      - "scripts/reconstruct_pipeline.py"
      - "tests/test_analysis_expansion_v0_15_1.py"
      - "tests/validate_analysis_expansion_v0_15_1.py"
      - "docs/V0_15_1_CONFIRMATORY_SPEC.md"
      - ".github/workflows/analysis-expansion-v0-15-1.yml"
  pull_request:
    branches: [main]
    paths:
      - "formal/analysis_alignments_v0_15.json"
      - "evidence/v0_15_1_preregistration.json"
      - "scripts/import_analysis_v0_15.py"
      - "scripts/analysis_intake_v0_15_1.py"
      - "scripts/reconstruct_pipeline.py"
      - "tests/test_analysis_expansion_v0_15_1.py"
      - "tests/validate_analysis_expansion_v0_15_1.py"
      - "docs/V0_15_1_CONFIRMATORY_SPEC.md"
      - ".github/workflows/analysis-expansion-v0-15-1.yml"

permissions:
  contents: read

jobs:
  confirmatory-analysis-expansion-v0-15-1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-map-goal-v0-7.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pytest

      - name: Python compilation checks
        run: |
          python -m py_compile scripts/import_analysis_v0_15.py
          python -m py_compile scripts/analysis_intake_v0_15_1.py
          python -m py_compile scripts/reconstruct_pipeline.py
          python -m py_compile tests/test_analysis_expansion_v0_15_1.py
          python -m py_compile tests/validate_analysis_expansion_v0_15_1.py

      - name: Reconstruct clean-room mathematical dependency chain
        run: |
          python scripts/reconstruct_pipeline.py

      - name: Run Pytest test suite
        run: |
          pytest tests/test_analysis_expansion_v0_15_1.py -v

      - name: Validate v0.15.1 Artifacts and Preregistered Bounds
        run: |
          python tests/validate_analysis_expansion_v0_15_1.py \
            --graph artifacts/analysis_v0_15_1/mapeogeo_v0_15_1_graph.json.gz \
            --dashboard artifacts/analysis_v0_15_1/analysis_expansion_dashboard.json \
            --prereg evidence/v0_15_1_preregistration.json

      - name: Upload v0.15.1 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-v0-15-1-analysis-expansion-artifacts
          path: artifacts/analysis_v0_15_1/
