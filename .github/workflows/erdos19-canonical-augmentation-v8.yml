name: erdos19-canonical-augmentation-v8
on:
  push:
    branches: [erdos19-canonical-augmentation-v8]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_erdos19_canonical_augmentation_v8.py tests/test_erdos19_exact_canonical_v8.py tests/test_erdos19_augmentation_cert_v8.py tests/test_erdos19_exhaustion_cert_v7.py -q
