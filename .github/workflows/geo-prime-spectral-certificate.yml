name: GEO-PRIME spectral identifiability certificate
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['experiments/geo_prime_spectral_partial_002/**','.github/workflows/geo-prime-spectral-certificate.yml']
  pull_request:
    paths: ['experiments/geo_prime_spectral_partial_002/**','.github/workflows/geo-prime-spectral-certificate.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd experiments/geo_prime_spectral_partial_002 && python -m unittest discover -v
