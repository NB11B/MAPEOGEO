name: erdos-formal-obligations-v2
on:
  push:
    branches: [erdos-formal-obligations-v2]
  pull_request:
    paths:
      - "mapeogeo/erdos_formal_obligations.py"
      - "tests/test_erdos_formal_obligations_v2.py"
      - ".github/workflows/erdos-formal-obligations-v2.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_erdos_campaign_v1.py tests/test_erdos_frontier_probes_v1.py tests/test_erdos_formal_obligations_v2.py -q
      - run: python -m pytest tests/test_work_router_contract_composition_v0_9.py tests/test_gfyproof_endpoint_contracts_v03.py -q
