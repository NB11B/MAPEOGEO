name: GEO-PRIME native cycle reconstruction
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['experiments/geo_prime_universal_002/**','.github/workflows/geo-prime-native.yml']
  pull_request:
    paths: ['experiments/geo_prime_universal_002/**','.github/workflows/geo-prime-native.yml']
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd experiments/geo_prime_universal_002
          python -m unittest discover -v
          python native.py
