name: Result 312 blind graph recovery
on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/result_312_blind_recovery.py"
      - ".github/workflows/result-312-blind-recovery.yml"
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Fetch frozen OpenAI/math
        run: |
          src="$RUNNER_TEMP/openai-math"; git init "$src"; git -C "$src" remote add origin https://github.com/openai/math.git
          git -C "$src" fetch --depth 1 origin adc7f1241b42e322a6451854ab7e4b4c146bf78a
          git -C "$src" checkout --detach FETCH_HEAD
      - name: Run blind recovery
        run: python experiments/result_312_blind_recovery.py --source-repo "$RUNNER_TEMP/openai-math" --registry formal/cross_source_alignments_v0_19.json --output artifacts/result_312_blind_recovery.json
      - uses: actions/upload-artifact@v4
        with: {name: result-312-blind-recovery, path: artifacts/result_312_blind_recovery.json}
