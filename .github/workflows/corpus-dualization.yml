name: MAPEOGEO v0.5 corpus dualization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/corpus_dualize_v0_5.py"
      - "scripts/corpus_dualize_v0_5_impl.py.gz"
      - "tests/test_corpus_dualizer.py"
      - "tests/validate_corpus_dualization_v0_5.py"
      - "requirements-corpus-dualization.txt"
      - "docs/V0_5_CORPUS_DUALIZATION_SPEC.md"
      - "data/gallier_quaintance_graph_v0_3.json.gz"
      - ".github/workflows/corpus-dualization.yml"

permissions:
  contents: read

env:
  SOURCE_URL: https://www.cis.upenn.edu/~jean/math-deep.pdf

jobs:
  corpus-dualization:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-corpus-dualization.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-corpus-dualization.txt

      - name: Run dualizer unit tests
        run: python -m pytest -q tests/test_corpus_dualizer.py

      - name: Download reference PDF transiently
        run: |
          mkdir -p "$RUNNER_TEMP/mapeogeo-source"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "$SOURCE_URL" \
            -o "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"
          test -s "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"

      - name: Run preregistered v0.5 corpus audit
        run: |
          rm -rf artifacts/corpus_dualization_v0_5
          python scripts/corpus_dualize_v0_5.py \
            "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf" \
            --base-graph data/gallier_quaintance_graph_v0_3.json.gz \
            --out-dir artifacts/corpus_dualization_v0_5 \
            --min-declarations 891 \
            --min-chapters 55 \
            --min-proofs 587 \
            --min-resolved-deps 626 \
            --max-unresolved-rate 0.101 \
            --min-direct-tag-coverage 0.60 \
            --min-dual-candidate-coverage 0.95

      - name: Validate v0.5 artifacts and copyright boundary
        run: python tests/validate_corpus_dualization_v0_5.py artifacts/corpus_dualization_v0_5

      - name: Remove transient source PDF
        if: always()
        run: rm -f "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"

      - name: Upload derived v0.5 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-corpus-dualization-v0.5
          path: artifacts/corpus_dualization_v0_5/
          if-no-files-found: error
          retention-days: 30
