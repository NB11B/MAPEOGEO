name: PCT goal solver v0.20 rigor

on:
  workflow_dispatch:
  push:
    branches: [agent/goal-solver-cross-class-v0-20]
    paths:
      - ".github/workflows/pct-goal-solver-v0-20-rigor.yml"
      - "evidence/pct_v0_20_cross_class_solver_report.json"
      - "evidence/pct_v0_20_cross_class_solver_report.json.sha256"
      - "evidence/pct_v0_20_repaired_main_binding.json"
      - "experiments/__init__.py"
      - "experiments/pct_e1_e25/**"
      - "experiments/pct_e26_e31/**"
      - "experiments/pct_goal_solver/**"
      - "tests/**"
      - "requirements-v0.20-lock.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pct-goal-solver-v0-20-rigor.yml"
      - "evidence/pct_v0_20_cross_class_solver_report.json"
      - "evidence/pct_v0_20_cross_class_solver_report.json.sha256"
      - "evidence/pct_v0_20_repaired_main_binding.json"
      - "experiments/__init__.py"
      - "experiments/pct_e1_e25/**"
      - "experiments/pct_e26_e31/**"
      - "experiments/pct_goal_solver/**"
      - "tests/**"
      - "requirements-v0.20-lock.txt"

permissions:
  contents: read

jobs:
  rigorous-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout feature revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: feature
          persist-credentials: false

      - name: Checkout exact repaired-main revision separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NB11B/MAPEOGEO
          ref: c52d61f5ab85bad85f3d49b51a811e609a52e1c0
          path: repaired-main
          fetch-depth: 1
          persist-credentials: false

      - name: Require repaired-main branch to remain at the bound commit
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git ls-remote --exit-code \
            https://github.com/NB11B/MAPEOGEO.git \
            refs/heads/agent/main-math-rigor-v0-20 | awk '{print $1}')"
          test "$observed" = "c52d61f5ab85bad85f3d49b51a811e609a52e1c0"

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: feature/requirements-v0.20-lock.txt

      - name: Install hash-locked feature dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r feature/requirements-v0.20-lock.txt

      - name: Verify exact repaired-main identity and file manifests
        run: >-
          python -m experiments.pct_goal_solver.repaired_main_binding
          --manifest evidence/pct_v0_20_repaired_main_binding.json
          --checkout ../repaired-main
        working-directory: feature

      - name: Rerun repaired-main integrity verifier
        shell: bash
        run: |
          set -euo pipefail
          python repaired-main/scripts/generate_mathematical_integrity_report.py \
            --out "$RUNNER_TEMP/v0_20_mathematical_integrity_report.json"
          cmp \
            "$RUNNER_TEMP/v0_20_mathematical_integrity_report.json" \
            repaired-main/evidence/v0_20_mathematical_integrity_report.json

      - name: Compile goal solver
        run: python -m compileall -q experiments/pct_goal_solver
        working-directory: feature

      - name: Run full required Python regression matrix
        run: >-
          python -m pytest -q
          experiments/pct_goal_solver
          experiments/pct_e1_e25
          experiments/pct_e26_e31
          tests
        working-directory: feature

      - name: Regenerate prospective v0.20 evidence
        run: >-
          python -m experiments.pct_goal_solver.generate_v0_20_report
          --out-dir "$RUNNER_TEMP/generated-goal-solver-v0-20"
        working-directory: feature

      - name: Enforce truthful campaign status and deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/generated-goal-solver-v0-20/pct_v0_20_cross_class_solver_report.json"
          REPORT_PATH="$report" python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          # Independent CI trust anchor: do not import expected values from the
          # campaign implementation being assessed.
          expected_status = "EVIDENCE_PARTIAL"
          expected_axes = {
              "engine_validity": "VALID",
              "evidence_completeness": "PARTIAL",
              "capability_support": "NOT_SUPPORTED",
          }
          expected_gates = {
              "closed_challenge_domain_valid": True,
              "exact_content_partition_disjoint": True,
              "nuisance_partition_disjoint": True,
              "terminal_controls_conform": True,
              "target_contract_enforced": True,
              "zero_known_wrong_positives": True,
              "independent_oracles_complete": False,
              "shortcut_proofs_complete": True,
              "runtime_lineage_receipts_complete": False,
              "implementation_manifest_bound": True,
              "dependency_lock_bound": True,
              "repaired_main_bound": True,
              "explicit_family_coverage": False,
              "inferred_family_coverage": False,
              "hybrid_family_coverage": False,
              "zero_macro_rescues": True,
              "exact_macro_conservation": False,
          }
          if report.get("scientific_status") != expected_status:
              raise SystemExit(
                  f"unexpected scientific status: {report.get('scientific_status')!r}; "
                  f"expected {expected_status!r}"
              )
          if report.get("scientific_axes") != expected_axes:
              raise SystemExit(
                  "scientific axes drifted from the reviewed expectation: "
                  f"observed={report.get('scientific_axes')!r}, "
                  f"expected={expected_axes!r}"
              )
          observed_gates = report.get("gates")
          if (
              type(observed_gates) is not dict
              or any(type(value) is not bool for value in observed_gates.values())
              or observed_gates != expected_gates
          ):
              raise SystemExit(
                  "scientific gate vector drifted from the reviewed expectation: "
                  f"observed={observed_gates!r}, expected={expected_gates!r}"
              )
          if report.get("total_wrong_positives") != 0:
              raise SystemExit("wrong-positive count is nonzero")
          provenance = report.get("provenance", {})
          if provenance.get("repaired_main_binding", {}).get("status") != "BOUND":
              raise SystemExit("repaired-main provenance is not bound")
          if provenance.get("dependency_lock_binding", {}).get("status") != "BOUND":
              raise SystemExit("dependency-lock provenance is not bound")
          PY
          cmp "$report" feature/evidence/pct_v0_20_cross_class_solver_report.json
          cmp \
            "$report.sha256" \
            feature/evidence/pct_v0_20_cross_class_solver_report.json.sha256
          cd "$RUNNER_TEMP/generated-goal-solver-v0-20"
          sha256sum -c pct_v0_20_cross_class_solver_report.json.sha256
