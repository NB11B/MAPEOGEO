name: MAPEOGEO v0.21 Rigor-First Expansion

on:
  workflow_dispatch:
  push:
    branches: [agent/rigor-first-expansion-v0-21]
    paths:
      - "formal/source_registry_v0_21.json"
      - "formal/source_declarations_v0_21.json.gz"
      - "scripts/source_registry_v0_21.py"
      - "scripts/structured_source_parsers_v0_21.py"
      - "scripts/source_admission_v0_21.py"
      - "scripts/freeze_v0_21_admission.py"
      - "scripts/rigor_expansion_v0_21.py"
      - "scripts/reconstruct_pipeline.py"
      - "tests/test_*v0_21.py"
      - "evidence/v0_21_source_admission_manifest.json"
      - "docs/superpowers/**"
      - ".github/workflows/rigor-expansion-v0-21.yml"

permissions:
  contents: write

jobs:
  v0-21-rigor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run v0.21 unit contracts
        run: >-
          python -m pytest
          tests/test_source_registry_v0_21.py
          tests/test_structured_source_parsers_v0_21.py
          tests/test_source_admission_v0_21.py
          tests/test_rigor_expansion_v0_21.py
          tests/test_freeze_v0_21_admission.py
          -q
      - name: Verify real pinned upstream sources
        env:
          MAPEOGEO_RUN_NETWORK_SOURCE_TESTS: "1"
          V0_21_LIVE_REPORT: artifacts/rigor_v0_21/source_admission_live.json
        run: python -m pytest tests/test_v0_21_real_source_integration.py -q -s
      - name: Freeze exact zero-prose admission identities
        run: >-
          python scripts/freeze_v0_21_admission.py
          artifacts/rigor_v0_21/source_admission_live.json
          --declarations-out artifacts/rigor_v0_21/source_declarations_v0_21.json.gz
          --evidence-out artifacts/rigor_v0_21/v0_21_source_admission_manifest.json
      - name: Upload frozen v0.21 source admission artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v0-21-source-admission-frozen
          path: |
            artifacts/rigor_v0_21/source_admission_live.json
            artifacts/rigor_v0_21/source_declarations_v0_21.json.gz
            artifacts/rigor_v0_21/v0_21_source_admission_manifest.json
          if-no-files-found: error
      - name: Freeze reviewed source identities on feature branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p formal evidence
          cp artifacts/rigor_v0_21/source_declarations_v0_21.json.gz formal/source_declarations_v0_21.json.gz
          cp artifacts/rigor_v0_21/v0_21_source_admission_manifest.json evidence/v0_21_source_admission_manifest.json
          if [ -z "$(git status --porcelain -- formal/source_declarations_v0_21.json.gz evidence/v0_21_source_admission_manifest.json)" ]; then
            echo "Frozen source identities already match live extraction."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formal/source_declarations_v0_21.json.gz evidence/v0_21_source_admission_manifest.json
          git commit -m "evidence(v0.21): freeze exact pinned-source admission identities"
          git push origin HEAD:agent/rigor-first-expansion-v0-21
