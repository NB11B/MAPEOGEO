name: MAPEOGEO v0.21 Rigor-First Expansion

on:
  workflow_dispatch:
  push:
    branches: [agent/rigor-first-expansion-v0-21]
    paths:
      - "formal/source_registry_v0_21.json"
      - "formal/source_declarations_v0_21.json"
      - "scripts/source_registry_v0_21.py"
      - "scripts/structured_source_parsers_v0_21.py"
      - "scripts/source_admission_v0_21.py"
      - "scripts/rigor_expansion_v0_21.py"
      - "scripts/reconstruct_pipeline.py"
      - "tests/test_*v0_21.py"
      - "evidence/v0_21_source_admission_manifest.json"
      - "docs/superpowers/**"
      - ".github/workflows/rigor-expansion-v0-21.yml"

permissions:
  contents: read

jobs:
  v0-21-rigor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run v0.21 unit contracts
        run: >-
          python -m pytest
          tests/test_source_registry_v0_21.py
          tests/test_structured_source_parsers_v0_21.py
          tests/test_source_admission_v0_21.py
          tests/test_rigor_expansion_v0_21.py
          -q
