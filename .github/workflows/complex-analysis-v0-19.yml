name: MAPEOGEO v0.19 Complex Analysis & Riemann Surfaces Expansion

on:
  workflow_dispatch:
  push:
    branches: [main, agent/math-expansion-v0-19, agent/math-expansion-v0-18]
    paths:
      - "data/**"
      - "formal/**"
      - "evidence/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/complex-analysis-v0-19.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "formal/**"
      - "evidence/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/complex-analysis-v0-19.yml"

permissions:
  contents: read

jobs:
  complex-analysis-v0-19:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-map-goal-v0-7.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pytest

      - name: Python compilation checks
        run: |
          python -m py_compile scripts/import_complex_analysis_v0_19.py
          python -m py_compile scripts/generate_alignments_v0_19.py
          python -m py_compile scripts/complex_analysis_intake_v0_19.py
          python -m py_compile scripts/reconstruct_pipeline.py
          python -m py_compile tests/test_complex_analysis_expansion_v0_19.py

      - name: Reconstruct mathematical dependency chain through v0.19
        run: |
          python scripts/reconstruct_pipeline.py --target-stage v0.19

      - name: Run Pytest test suite
        run: |
          pytest tests/test_diffgeom_expansion_v0_18.py tests/test_complex_analysis_expansion_v0_19.py -v

      - name: Upload v0.19 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-v0-19-complex-analysis-expansion-artifacts
          path: artifacts/complex_analysis_v0_19/
