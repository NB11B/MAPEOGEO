name: MAPEOGEO v0.15 Real Analysis and Differential Calculus Expansion (Exploratory Pilot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis-expansion-v0-15:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-map-goal-v0-7.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pytest

      - name: Reconstruct dependency chain
        run: |
          python scripts/reconstruct_pipeline.py --target-stage v0.14

      - name: Run v0.15 Analysis Expansion Intake
        run: |
          python scripts/analysis_intake_v0_15.py \
            --base-graph artifacts/convex_v0_14/mapeogeo_v0_14_graph.json.gz \
            --alignments formal/analysis_alignments_v0_15.json \
            --out-dir artifacts/analysis_v0_15

      - name: Run Pytest test suite
        run: |
          pytest tests/test_analysis_expansion_v0_15.py -v

      - name: Validate v0.15 Artifacts and Preregistered Bounds
        run: |
          python tests/validate_analysis_expansion_v0_15.py \
            --graph artifacts/analysis_v0_15/mapeogeo_v0_15_graph.json.gz \
            --dashboard artifacts/analysis_v0_15/analysis_expansion_dashboard.json \
            --prereg evidence/v0_15_preregistration.json

      - name: Upload v0.15 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-v0-15-analysis-expansion-artifacts
          path: artifacts/analysis_v0_15/
