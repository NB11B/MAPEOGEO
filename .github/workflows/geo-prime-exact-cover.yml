name: GEO-PRIME unlabeled exact-cover inference
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['experiments/geo_prime_universal_006/**','.github/workflows/geo-prime-exact-cover.yml']
  pull_request:
    paths: ['experiments/geo_prime_universal_006/**','.github/workflows/geo-prime-exact-cover.yml']
jobs:
  exact-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd experiments/geo_prime_universal_006
          python -m unittest discover -v
          python inference.py
