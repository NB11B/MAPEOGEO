name: GEO-EULER proof-carrying discovery
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths:
      - 'experiments/geo_euler_003/**'
      - 'experiments/geo_euler_004/**'
      - 'experiments/geo_euler_005/**'
      - 'MAPEOGEOFormal/GeoEuler*.lean'
      - '.github/workflows/geo-euler-extraction.yml'
  pull_request:
    paths:
      - 'experiments/geo_euler_003/**'
      - 'experiments/geo_euler_004/**'
      - 'experiments/geo_euler_005/**'
      - 'MAPEOGEOFormal/GeoEuler*.lean'
      - '.github/workflows/geo-euler-extraction.yml'
jobs:
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Mutation and provenance validation
        run: |
          cd experiments/geo_euler_005
          python -m unittest discover -v
          python bridge.py
      - name: Kernel certify emitted recurrence grammar
        run: |
          lake build MAPEOGEOFormal.GeoEuler MAPEOGEOFormal.GeoEulerCertificate
          lake env lean MAPEOGEOFormal/GeoEulerSelected.lean
      - name: Falsify changed grammar with kernel
        run: python experiments/geo_euler_005/lean_mutations.py
