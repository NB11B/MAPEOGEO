name: GFYProof Bridge v1

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: \${{ github.workspace }}/gfyproof:\${{ github.workspace }}
    steps:
      - name: Checkout MAPEOGEO
        uses: actions/checkout@v4
      - name: Require GFYProof read credential\n        env:\n          GFYPROOF_READ_TOKEN: \${{ secrets.GFYPROOF_READ_TOKEN }}\n        run: |\n          if [ -z "$GFYPROOF_READ_TOKEN" ]; then\n            echo "::error::Missing GFYPROOF_READ_TOKEN with read access to NB11B/GFYProof"\n            exit 1\n          fi\n      - name: Checkout independent GFYProof verifier
        uses: actions/checkout@v4
        with:
          repository: NB11B/GFYProof\n          token: \${{ secrets.GFYPROOF_READ_TOKEN }}
          path: gfyproof
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy pandas sympy scipy pymupdf
      - name: Run local bridge and grounding rigor tests
        run: |
          python -m pytest -q \
            tests/test_gfyproof_bridge.py \
            tests/test_foundation_grounding_rigor.py \
            tests/test_gfyproof_endpoint_contracts_v03.py \
            tests/test_gfyproof_real_demorgan_roundtrip.py
      - name: Reconstruct foundation graph
        run: python scripts/reconstruct_pipeline.py --target-stage foundation
      - name: Run Farkas semantic-binding gate
        run: |
          python -m pytest -q \
            tests/test_gfyproof_farkas_endpoint_contracts.py
