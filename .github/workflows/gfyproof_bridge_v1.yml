name: GFYProof Bridge v1

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout MAPEOGEO
        uses: actions/checkout@v4
      - name: Checkout GFYProof bridge branch
        uses: actions/checkout@v4
        with:
          repository: NB11B/GFYProof
          ref: agent/e097-e102-mapeogeo-bridge
          path: _gfyproof
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy pandas sympy scipy
      - name: Run bridge and grounding rigor tests
        env:
          PYTHONPATH: ${{ github.workspace }}/_gfyproof:${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_gfyproof_bridge.py \
            tests/test_foundation_grounding_rigor.py \
            tests/test_gfyproof_real_demorgan_roundtrip.py