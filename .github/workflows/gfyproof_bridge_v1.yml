name: GFYProof Bridge v1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout MAPEOGEO
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy pandas sympy scipy pymupdf "pyyaml>=6,<7"
      - name: Run independent local replay and ingestion audit tests
        run: |
          python -m pytest -q \
            tests/test_gfyproof_bridge.py \
            tests/test_gfyproof_replay.py \
            tests/test_gfyproof_real_demorgan_roundtrip.py \
            tests/test_foundation_grounding_rigor.py \
            tests/test_gfyproof_endpoint_contracts_v03.py \
            tests/audit/test_gfyproof_ingestion_known_gap.py
      - name: Reconstruct foundation graph
        run: python scripts/reconstruct_pipeline.py --target-stage foundation
      - name: Run Farkas semantic-binding gate
        run: |
          python -m pytest -q \
            tests/test_gfyproof_farkas_endpoint_contracts.py
      - name: Run supporting repository regression tests
        run: |
          python -m pytest -q \
            tests/test_intelligence_import_boundary.py \
            tests/test_c10_scale_benchmark.py \
            tests/test_c12_cli_interfaces.py \
            tests/test_pinch_intake_v0_11.py \
            tests/test_math_intake_workflow.py \
            tests/test_source_pdf_identity.py \
            tests/test_lp_contract.py \
            tests/test_lp_pagination_binding.py \
            tests/test_mathematical_integrity_provenance.py \
            tests/test_mathematical_integrity_amendments.py \
            tests/test_current_integrity_reporting.py
