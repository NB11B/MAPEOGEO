name: GFYProof Bridge v1

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout MAPEOGEO
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy pandas sympy scipy pymupdf
      - name: Run local bridge and grounding rigor tests
        run: |
          python -m pytest -q \
            tests/test_gfyproof_bridge.py \
            tests/test_foundation_grounding_rigor.py \
            tests/test_gfyproof_endpoint_contracts_v03.py \
            tests/audit/test_gfyproof_ingestion_known_gap.py
      - name: Reconstruct foundation graph
        run: python scripts/reconstruct_pipeline.py --target-stage foundation
      - name: Run Farkas semantic-binding gate
        run: |
          python -m pytest -q \
            tests/test_gfyproof_farkas_endpoint_contracts.py
