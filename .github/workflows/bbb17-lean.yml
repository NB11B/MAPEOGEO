name: BBB17 discovery and Lean qualification
on:
  push:
    branches: [research/bbb17-lean-proof]
  pull_request:
    paths:
      - 'experiments/bbb17_lean/**'
      - '.github/workflows/bbb17-lean.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test discovery and recorded falsification
        run: |
          cd experiments/bbb17_lean
          python -m unittest -v test_discover.py
          python discover.py --steps 1000000 --out discovery.json
      - uses: leanprover/lean-action@v1
        with:
          lean-version: 'v4.21.0'
      - name: Check Lean formal definitions
        run: |
          cd experiments/bbb17_lean
          lean -o BBB17.olean BBB17.lean
          LEAN_PATH=. lean -o OperatorMacros.olean OperatorMacros.lean
          LEAN_PATH=. lean -o TwoStepMacros.olean TwoStepMacros.lean
          LEAN_PATH=. lean -o SweepMacros.olean SweepMacros.lean
          LEAN_PATH=. lean -o CollatzBridge.olean CollatzBridge.lean
          LEAN_PATH=. lean -o PhaseArithmetic.olean PhaseArithmetic.lean
          LEAN_PATH=. lean -o ArithmeticOrbitBridge.olean ArithmeticOrbitBridge.lean
          LEAN_PATH=. lean CollatzReduction.lean
