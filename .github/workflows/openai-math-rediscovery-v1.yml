name: OpenAI math withheld relationship rediscovery

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "experiments/openai_math_rediscovery_v1.py"
      - ".github/workflows/openai-math-rediscovery-v1.yml"

permissions:
  contents: read

jobs:
  rediscovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout MAPEOGEO
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Fetch frozen OpenAI math source
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/openai-math"
          git init "$src"
          git -C "$src" remote add origin https://github.com/openai/math.git
          git -C "$src" fetch --depth 1 origin adc7f1241b42e322a6451854ab7e4b4c146bf78a
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "adc7f1241b42e322a6451854ab7e4b4c146bf78a"
      - name: Run frozen withheld-edge experiment
        run: |
          python experiments/openai_math_rediscovery_v1.py \
            --source-repo "$RUNNER_TEMP/openai-math" \
            --output artifacts/openai_math_rediscovery_v1.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: openai-math-rediscovery-v1
          path: artifacts/openai_math_rediscovery_v1.json
          if-no-files-found: error
