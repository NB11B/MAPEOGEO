name: MAPEOGEO v0.21 Wave F3 Mathematical Expansion

on:
  workflow_dispatch:
  push:
    branches:
      - agent/math-expansion-rigor-v0-21-wave-f3
      - agent/math-expansion-rigor-v0-21
      - main
    paths:
      - "MAPEOGEOFormal.lean"
      - "MAPEOGEOFormal/**"
      - "data/**"
      - "docs/**"
      - "evidence/**"
      - "formal/**"
      - "mapeogeo/**"
      - "scripts/**"
      - "tests/**"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "requirements-math-rigor-v0-20.lock"
      - ".github/workflows/wave-f3-v0-21.yml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-math-rigor-v0-20.lock

      - name: Install hash-locked Python dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-math-rigor-v0-20.lock

      - name: Compile Wave F3 Python modules
        run: |
          python -m py_compile \
            mapeogeo/algebra/models.py \
            mapeogeo/algebra/number_theory.py \
            mapeogeo/algebra/groups.py \
            mapeogeo/algebra/rings_fields.py \
            mapeogeo/algebra/evaluator.py \
            mapeogeo/algebra/relations.py \
            scripts/wave_f3_campaign.py \
            scripts/reconstruct_pipeline.py \
            tests/test_wave_f3_algebra.py

      - name: Install Lean and kernel-build the pinned project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
          use-github-cache: true
          leanchecker: false
          nanoda: false

      - name: Run complete regression test suite
        run: python -m pytest tests -v

      - name: Reconstruct twice from clean exported trees
        shell: bash
        run: |
          set -euo pipefail
          recon_a="$RUNNER_TEMP/mapeogeo-f3-a"
          recon_b="$RUNNER_TEMP/mapeogeo-f3-b"
          mkdir -p "$recon_a" "$recon_b"
          git archive --format=tar HEAD | tar -xf - -C "$recon_a"
          git archive --format=tar HEAD | tar -xf - -C "$recon_b"

          (cd "$recon_a" && python scripts/reconstruct_pipeline.py --target-stage wave_f3)
          (cd "$recon_b" && python scripts/reconstruct_pipeline.py --target-stage wave_f3)

          (cd "$recon_a" && find artifacts -type f -print0 | sort -z | xargs -0 sha256sum) \
            > "$RUNNER_TEMP/reconstruction-a.sha256"
          (cd "$recon_b" && find artifacts -type f -print0 | sort -z | xargs -0 sha256sum) \
            > "$RUNNER_TEMP/reconstruction-b.sha256"
          cmp \
            "$RUNNER_TEMP/reconstruction-a.sha256" \
            "$RUNNER_TEMP/reconstruction-b.sha256"

      - name: Verify sealed baseline immutability
        run: |
          git diff --exit-code -- \
            data/mapeogeo_v0_11_graph.json.gz \
            formal/cross_source_alignments_v0_19.json \
            evidence/v0_19_scientific_results.json \
            evidence/v0_21_wave_f1_scientific_results.json \
            evidence/v0_21_wave_f2_commutation_results.json
