name: erdos19-residual-list-coloring-v4
on:
  push:
    branches: [erdos19-residual-list-coloring-v4]
  pull_request:
    paths:
      - "mapeogeo/erdos19_residual_list_coloring.py"
      - "tests/test_erdos19_residual_list_coloring_v4.py"
      - ".github/workflows/erdos19-residual-list-coloring-v4.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_erdos19_rank_decomposition_v3.py tests/test_erdos19_pair_budget_v3.py tests/test_erdos19_residual_list_coloring_v4.py -q
      - run: python -m pytest tests/test_erdos19_constructor_v1.py tests/test_erdos19_degeneracy_falsification_v2.py tests/test_erdos_formal_obligations_v2.py -q
