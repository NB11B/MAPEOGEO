permissions:
  contents: read
  actions: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen solver baseline
        uses: actions/checkout@v4
        with:
          ref: 6c9333ed3ec48a298ad943a74e72a01fa1ffcd78
          path: .crossbranch/frozen-solver
      - name: Checkout frozen knowledge baseline
        uses: actions/checkout@v4
        with:
          ref: fd2d90c00cb71951fdfd7cd1e7e22a8f0552f97f
          path: .crossbranch/frozen-main
      - name: Download frozen v0.15.1 confirmatory artifact
        uses: actions/download-artifact@v4
        with:
          name: mapeogeo-v0-15-1-analysis-expansion-artifacts
          path: .crossbranch/frozen-main-artifact
          github-token: ${{ github.token }}
          repository: NB11B/MAPEOGEO
          run-id: 35026462131
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pct-e1-e25.txt
      - name: Install campaign dependencies
        run: python -m pip install -r requirements-pct-e1-e25.txt
      - name: Static check
        run: |
          python -m py_compile experiments/pct_e1_e25/campaign.py experiments/pct_e1_e25/test_campaign.py
          python -m compileall -q experiments/pct_e25bc
          python -m compileall -q experiments/pct_e25def
          python -m compileall -q experiments/pct_e25gh
          python -m compileall -q experiments/pct_e25ij
          python -m compileall -q experiments/pct_e26_e31
      - name: Generate candidate E25G E25H evidence
        run: python -m experiments.pct_e25gh.generate_evidence --out-dir generated-e25gh
      - name: Upload candidate E25G E25H evidence
        uses: actions/upload-artifact@v4
        with:
          name: pct-e25gh-generated-evidence
          path: generated-e25gh/*.json
          if-no-files-found: error
      - name: Generate candidate E25I E25J evidence
        run: python -m experiments.pct_e25ij.generate_evidence --out-dir generated-e25ij
      - name: Upload candidate E25I E25J evidence
        uses: actions/upload-artifact@v4
        with:
          name: pct-e25ij-generated-evidence
          path: generated-e25ij/*.json
          if-no-files-found: error
      - name: Generate candidate E26 E31 evidence
        run: python -m experiments.pct_e26_e31.generate_evidence --out-dir generated-e26-e31
      - name: Upload candidate E26 E31 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pct-e26-e31-generated-evidence
          path: generated-e26-e31/*.json
          if-no-files-found: error
      - name: Run PCT campaign regression suite
        run: python -m pytest -q experiments/pct_e1_e25/test_campaign.py experiments/pct_e25bc/test_audit.py experiments/pct_e25def/test_e25def.py experiments/pct_e25gh/test_e25gh.py experiments/pct_e25ij/test_e25ij.py experiments/pct_e25ij/test_evidence.py experiments/pct_e26_e31/test_e26.py experiments/pct_e26_e31/test_e27_core.py experiments/pct_e26_e31/test_e27_campaign.py experiments/pct_e26_e31/test_e28.py experiments/pct_e26_e31/test_e29.py experiments/pct_e26_e31/test_e30.py experiments/pct_e26_e31/test_e31.py experiments/pct_e26_e31/test_evidence.py
