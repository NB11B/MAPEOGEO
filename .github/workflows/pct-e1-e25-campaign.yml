      - "evidence/pct_e25h_policy_comparison.json"
      - "evidence/pct_e25i_closure_receipt_ledger.json"
      - "evidence/pct_e25i_derived_closure_snapshot.json"
      - "evidence/pct_e25j_revocation_staleness.json"
      - "docs/PCT_E1_E25_CAMPAIGN_REPORT.md"
      - "docs/PCT_E25B_E25C_EXECUTABLE_MULTIPATH_REPORT.md"
      - "docs/PCT_E25D_E25F_CLOSURE_PROGRAM_REPORT.md"
      - "docs/PCT_E25G_E25H_C5_POLICY_REPORT.md"
      - "docs/PCT_E25I_E25J_CLOSURE_LIFECYCLE_REPORT.md"
      - "docs/superpowers/specs/2026-09-15-e25def-closure-depth-verification-design.md"
      - "docs/superpowers/specs/2026-09-15-e25gh-c5-policy-design.md"
      - "docs/superpowers/specs/2026-09-15-e25ij-closure-lifecycle-design.md"
      - "docs/superpowers/plans/2026-09-15-e25def-closure-depth-verification.md"
      - "docs/superpowers/plans/2026-09-15-e25gh-c5-policy-implementation.md"
      - "docs/superpowers/plans/2026-09-15-e25ij-closure-lifecycle-implementation.md"
      - "requirements-pct-e1-e25.txt"
      - ".github/workflows/pct-e1-e25-campaign.yml"
  pull_request:
    paths:
      - "experiments/pct_e1_e25/**"
      - "experiments/pct_e25bc/**"
      - "experiments/pct_e25def/**"
      - "experiments/pct_e25gh/**"
      - "experiments/pct_e25ij/**"
      - "evidence/pct_e1_e25_campaign.json"
      - "evidence/pct_e23_counterexamples.json"
      - "evidence/pct_e25_graph_consistency_audit.json"
      - "evidence/pct_e25b_trust_projection.json"
      - "evidence/pct_e25b_multipath_audit.json"
      - "evidence/pct_e25c_executable_cycle_audit.json"
      - "evidence/pct_e25bc_synthetic_attacks.json"
      - "evidence/pct_e25d_real_component_manifest.json"
      - "evidence/pct_e25d_closure_atlas.json"
      - "evidence/pct_e25e_upgrade_plan.json"
      - "evidence/pct_e25f_fault_coverage.json"
      - "evidence/pct_e25g_exact_morphism_audit.json"
      - "evidence/pct_e25g_provenance_bindings.json"
      - "evidence/pct_e25h_policy_comparison.json"
      - "evidence/pct_e25i_closure_receipt_ledger.json"
      - "evidence/pct_e25i_derived_closure_snapshot.json"
      - "evidence/pct_e25j_revocation_staleness.json"
      - "docs/PCT_E1_E25_CAMPAIGN_REPORT.md"
      - "docs/PCT_E25B_E25C_EXECUTABLE_MULTIPATH_REPORT.md"
      - "docs/PCT_E25D_E25F_CLOSURE_PROGRAM_REPORT.md"
      - "docs/PCT_E25G_E25H_C5_POLICY_REPORT.md"
      - "docs/PCT_E25I_E25J_CLOSURE_LIFECYCLE_REPORT.md"
      - "docs/superpowers/specs/2026-09-15-e25def-closure-depth-verification-design.md"
      - "docs/superpowers/specs/2026-09-15-e25gh-c5-policy-design.md"
      - "docs/superpowers/specs/2026-09-15-e25ij-closure-lifecycle-design.md"
      - "docs/superpowers/plans/2026-09-15-e25def-closure-depth-verification.md"
      - "docs/superpowers/plans/2026-09-15-e25gh-c5-policy-implementation.md"
      - "docs/superpowers/plans/2026-09-15-e25ij-closure-lifecycle-implementation.md"
      - "requirements-pct-e1-e25.txt"
      - ".github/workflows/pct-e1-e25-campaign.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pct-e1-e25.txt
      - name: Install campaign dependencies
        run: python -m pip install -r requirements-pct-e1-e25.txt
      - name: Static check
        run: |
          python -m py_compile experiments/pct_e1_e25/campaign.py experiments/pct_e1_e25/test_campaign.py
          python -m compileall -q experiments/pct_e25bc
          python -m compileall -q experiments/pct_e25def
          python -m compileall -q experiments/pct_e25gh
          python -m compileall -q experiments/pct_e25ij
      - name: Generate candidate E25G E25H evidence
        run: python -m experiments.pct_e25gh.generate_evidence --out-dir generated-e25gh
      - name: Upload candidate E25G E25H evidence
        uses: actions/upload-artifact@v4
        with:
          name: pct-e25gh-generated-evidence
          path: generated-e25gh/*.json
          if-no-files-found: error
      - name: Run PCT campaign regression suite
        run: python -m pytest -q experiments/pct_e1_e25/test_campaign.py experiments/pct_e25bc/test_audit.py experiments/pct_e25def/test_e25def.py experiments/pct_e25gh/test_e25gh.py experiments/pct_e25ij/test_e25ij.py
