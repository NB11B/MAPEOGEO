name: PCT goal-directed mixed-domain solver

on:
  push:
    branches: [agent/pct-computational-architecture]
    paths:
      - "experiments/pct_goal_solver/**"
      - ".github/workflows/pct-goal-solver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pct-e1-e25.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-pct-e1-e25.txt
      - name: Compile goal solver
        run: python -m compileall -q experiments/pct_goal_solver
      - name: Test goal solver
        run: python -m pytest -q experiments/pct_goal_solver
      - name: Historical E1-E25 parity smoke
        run: python -m pytest -q experiments/pct_e1_e25/test_campaign.py
      - name: Generate scientific campaign report
        run: python -m experiments.pct_goal_solver.generate_report --out-dir generated-goal-solver
      - name: Upload goal solver results
        uses: actions/upload-artifact@v4
        with:
          name: pct-goal-solver-results
          path: generated-goal-solver/*
          if-no-files-found: error
      - name: Generate V2 composition stress report
        run: python -m experiments.pct_goal_solver.generate_v2_report --out-dir generated-goal-solver-v2
      - name: Upload V2 composition stress results
        uses: actions/upload-artifact@v4
        with:
          name: pct-goal-solver-v2-results
          path: generated-goal-solver-v2/*
          if-no-files-found: error
