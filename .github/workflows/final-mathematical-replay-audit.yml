name: Final Mathematical Replay Verification Audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest numpy pandas sympy scipy pymupdf
      - run: python -m pytest -q tests/audit/test_final_mathematical_replay_gap.py
