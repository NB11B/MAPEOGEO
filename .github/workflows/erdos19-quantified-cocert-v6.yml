name: erdos19-quantified-cocert-v6
on:
  push:
    branches: [erdos19-quantified-cocert-v6]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_erdos19_quantified_cocert_v6.py tests/test_erdos19_frontier13_v5.py -q
