name: MAPEOGEO v0.14 Convex Analysis and Optimization Expansion

on:
  workflow_dispatch:
  push:
    branches: [main, agent/math-expansion-v0-14]
    paths:
      - "formal/convex_alignments_v0_14.json"
      - "evidence/v0_14_preregistration.json"
      - "scripts/import_cvx_v0_14.py"
      - "scripts/convex_intake_v0_14.py"
      - "tests/test_convex_expansion_v0_14.py"
      - "tests/validate_convex_expansion_v0_14.py"
      - "docs/V0_14_CONVEX_EXPANSION_SPEC.md"
      - ".github/workflows/convex-expansion-v0-14.yml"
  pull_request:
    branches: [main]
    paths:
      - "formal/convex_alignments_v0_14.json"
      - "evidence/v0_14_preregistration.json"
      - "scripts/import_cvx_v0_14.py"
      - "scripts/convex_intake_v0_14.py"
      - "tests/test_convex_expansion_v0_14.py"
      - "tests/validate_convex_expansion_v0_14.py"
      - "docs/V0_14_CONVEX_EXPANSION_SPEC.md"
      - ".github/workflows/convex-expansion-v0-14.yml"

permissions:
  contents: read

jobs:
  convex-expansion-v0-14:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-map-goal-v0-7.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pytest

      - name: Python compilation checks
        run: |
          python -m py_compile scripts/import_cvx_v0_14.py
          python -m py_compile scripts/convex_intake_v0_14.py
          python -m py_compile tests/test_convex_expansion_v0_14.py
          python -m py_compile tests/validate_convex_expansion_v0_14.py

      - name: Reconstruct mathematical dependency chain through v0.13
        run: |
          python scripts/reconstruct_pipeline.py --target-stage v0.13

      - name: Run Pytest test suite
        run: |
          pytest tests/test_convex_expansion_v0_14.py -v

      - name: Run v0.14 Convex Expansion Intake
        run: |
          python scripts/convex_intake_v0_14.py \
            --base-graph artifacts/tri_source_v0_13/mapeogeo_v0_13_graph.json.gz \
            --alignments formal/convex_alignments_v0_14.json \
            --out-dir artifacts/convex_v0_14

      - name: Validate v0.14 Artifacts and Preregistered Bounds
        run: |
          python tests/validate_convex_expansion_v0_14.py \
            --graph artifacts/convex_v0_14/mapeogeo_v0_14_graph.json.gz \
            --dashboard artifacts/convex_v0_14/convex_expansion_dashboard.json \
            --prereg evidence/v0_14_preregistration.json

      - name: Upload v0.14 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-v0-14-convex-expansion-artifacts
          path: artifacts/convex_v0_14/
