name: MAPEOGEO v0.12 Cross-Source Mathematics Expansion

on:
  workflow_dispatch:
  push:
    branches: [main, agent/math-expansion-v0-12]
    paths:
      - "formal/cross_source_alignments_v0_12.json"
      - "evidence/v0_12_preregistration.json"
      - "scripts/import_axler_v0_12.py"
      - "scripts/cross_source_intake_v0_12.py"
      - "tests/test_cross_source_v0_12.py"
      - "tests/validate_cross_source_v0_12.py"
      - "docs/V0_12_CROSS_SOURCE_EXPANSION_SPEC.md"
      - ".github/workflows/cross-source-v0-12.yml"
  pull_request:
    branches: [main]
    paths:
      - "formal/cross_source_alignments_v0_12.json"
      - "evidence/v0_12_preregistration.json"
      - "scripts/import_axler_v0_12.py"
      - "scripts/cross_source_intake_v0_12.py"
      - "tests/test_cross_source_v0_12.py"
      - "tests/validate_cross_source_v0_12.py"
      - "docs/V0_12_CROSS_SOURCE_EXPANSION_SPEC.md"
      - ".github/workflows/cross-source-v0-12.yml"

permissions:
  contents: read

jobs:
  cross-source-v0-12:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-map-goal-v0-7.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pytest

      - name: Python compilation checks
        run: |
          python -m py_compile scripts/import_axler_v0_12.py
          python -m py_compile scripts/cross_source_intake_v0_12.py
          python -m py_compile tests/test_cross_source_v0_12.py
          python -m py_compile tests/validate_cross_source_v0_12.py

      - name: Run Pytest test suite
        run: |
          pytest tests/test_cross_source_v0_12.py -v

      - name: Run v0.12 Cross-Source Expansion Intake
        run: |
          python scripts/cross_source_intake_v0_12.py \
            --alignments formal/cross_source_alignments_v0_12.json \
            --preregistration evidence/v0_12_preregistration.json \
            --out-dir artifacts/cross_source_v0_12

      - name: Validate v0.12 Artifacts and Boundaries
        run: |
          python tests/validate_cross_source_v0_12.py artifacts/cross_source_v0_12

      - name: Upload v0.12 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-v0-12-cross-source-artifacts
          path: artifacts/cross_source_v0_12/
