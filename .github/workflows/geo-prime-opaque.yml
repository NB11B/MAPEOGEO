name: GEO-PRIME opaque family qualification
on:
  push:
    branches: ['experiments/geo-bsl-001']
    paths: ['experiments/geo_prime_universal_003/**','.github/workflows/geo-prime-opaque.yml']
  pull_request:
    paths: ['experiments/geo_prime_universal_003/**','.github/workflows/geo-prime-opaque.yml']
jobs:
  opaque:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd experiments/geo_prime_universal_003
          python -m unittest discover -v
          python discovery.py
