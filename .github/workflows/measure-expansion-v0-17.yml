name: MAPEOGEO v0.17 Measure & Probability Expansion

on:
  workflow_dispatch:
  push:
    branches: [main, agent/math-expansion-v0-17, agent/math-expansion-v0-16]
    paths:
      - "data/**"
      - "formal/**"
      - "evidence/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/measure-expansion-v0-17.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "formal/**"
      - "evidence/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/measure-expansion-v0-17.yml"

permissions:
  contents: read

jobs:
  measure-expansion-v0-17:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-map-goal-v0-7.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pytest

      - name: Python compilation checks
        run: |
          python -m py_compile scripts/import_billingsley_v0_17.py
          python -m py_compile scripts/generate_alignments_v0_17.py
          python -m py_compile scripts/measure_intake_v0_17.py
          python -m py_compile scripts/reconstruct_pipeline.py
          python -m py_compile tests/test_measure_expansion_v0_17.py

      - name: Reconstruct mathematical dependency chain through v0.17
        run: |
          python scripts/reconstruct_pipeline.py --target-stage v0.17

      - name: Run Pytest test suite
        run: |
          pytest tests/test_topology_expansion_v0_16.py tests/test_measure_expansion_v0_17.py -v

      - name: Upload v0.17 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-v0-17-measure-expansion-artifacts
          path: artifacts/measure_v0_17/
