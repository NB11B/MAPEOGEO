name: MAPEOGEO v0.11 Pinch-Driven Mathematics Intake

on:
  workflow_dispatch:
  push:
    branches: [main, agent/math-intake-v0-11]
    paths:
      - "MAPEOGEOFormal.lean"
      - "MAPEOGEOFormal/**"
      - "formal/pinch_bindings_v0_11.json"
      - "scripts/audit_pinch_source_v0_11.py"
      - "scripts/pinch_contracts_v0_11.py"
      - "scripts/pinch_intake_v0_11.py"
      - "tests/test_pinch_source_audit_v0_11.py"
      - "tests/test_pinch_intake_v0_11.py"
      - "tests/test_math_intake_workflow.py"
      - "scripts/check_source_pdf_identity.py"
      - "scripts/correct_v09_source_binding.py"
      - "formal/proof_paths_v0_9_corrected_v1.json"
      - "tests/test_v09_source_correction.py"
      - "tests/test_v09_correction_provenance.py"
      - "tests/test_source_pdf_identity.py"
      - "evidence/v0_7_acceptance_manifest.json"
      - "requirements-map-goal-v0-7.txt"
      - "requirements-pct-v0-10.txt"
      - "ngc_geometry_lab/requirements.txt"
      - "tests/validate_pinch_intake_v0_11.py"
      - "docs/V0_11_MATHEMATICS_INTAKE_SPEC.md"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/math-intake-v0-11.yml"
  pull_request:
    branches: [main]
    paths:
      - "MAPEOGEOFormal.lean"
      - "MAPEOGEOFormal/**"
      - "formal/pinch_bindings_v0_11.json"
      - "scripts/audit_pinch_source_v0_11.py"
      - "scripts/pinch_contracts_v0_11.py"
      - "scripts/pinch_intake_v0_11.py"
      - "tests/test_pinch_source_audit_v0_11.py"
      - "tests/test_pinch_intake_v0_11.py"
      - "tests/test_math_intake_workflow.py"
      - "scripts/check_source_pdf_identity.py"
      - "scripts/correct_v09_source_binding.py"
      - "formal/proof_paths_v0_9_corrected_v1.json"
      - "tests/test_v09_source_correction.py"
      - "tests/test_v09_correction_provenance.py"
      - "tests/test_source_pdf_identity.py"
      - "evidence/v0_7_acceptance_manifest.json"
      - "requirements-map-goal-v0-7.txt"
      - "requirements-pct-v0-10.txt"
      - "ngc_geometry_lab/requirements.txt"
      - "tests/validate_pinch_intake_v0_11.py"
      - "docs/V0_11_MATHEMATICS_INTAKE_SPEC.md"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/math-intake-v0-11.yml"

permissions:
  contents: read

env:
  # Retrieve the accepted edition transiently; never cache or redistribute the PDF.
  # The unchanged mandatory identity guard authenticates these archived bytes.
  SOURCE_URL: https://web.archive.org/web/20250429162547id_/https://www.cis.upenn.edu/~jean/math-deep.pdf

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-map-goal-v0-7.txt
            requirements-pct-v0-10.txt
            ngc_geometry_lab/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install \
            -r requirements-map-goal-v0-7.txt \
            -r requirements-pct-v0-10.txt \
            -r ngc_geometry_lab/requirements.txt \
            "networkx>=3,<4" "pyyaml>=6,<7"

      - name: Static-check and run unit tests
        run: |
          python -m py_compile scripts/audit_pinch_source_v0_11.py
          python -m py_compile scripts/pinch_contracts_v0_11.py
          python -m py_compile scripts/pinch_intake_v0_11.py
          python -m py_compile tests/test_pinch_source_audit_v0_11.py
          python -m py_compile tests/test_pinch_intake_v0_11.py
          python -m py_compile tests/validate_pinch_intake_v0_11.py
          python -m py_compile tests/test_math_intake_workflow.py
          pytest

  # Run the real source/proof pipeline even when unrestricted pytest cannot collect.
  proof-verification:
    outputs:
      evidence-artifact-id: ${{ steps.stage-evidence.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-map-goal-v0-7.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-map-goal-v0-7.txt pytest sympy

      # Build first so source download/audit failures cannot hide real Lean results.
      - name: Install Lean, build all formalizations, and run leanchecker
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        env:
          LEAN_NUM_THREADS: "1"
        with:
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
          use-github-cache: true
          leanchecker: true
          nanoda: false

      - name: Download reference PDF transiently
        run: |
          mkdir -p "$RUNNER_TEMP/mapeogeo-source"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "$SOURCE_URL" -o "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"
          test -s "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"

      - name: Require accepted source PDF identity
        run: |
          python scripts/check_source_pdf_identity.py \
            "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf" \
            --manifest evidence/v0_7_acceptance_manifest.json

      - name: Regenerate accepted v0.6 representation
        run: |
          rm -rf "$RUNNER_TEMP/mapeogeo-v06"
          python scripts/independent_dual_view_v0_6.py \
            "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf" \
            --base-graph data/gallier_quaintance_graph_v0_3.json.gz \
            --out-dir "$RUNNER_TEMP/mapeogeo-v06" \
            --min-declarations 1355 \
            --min-definitions 463 \
            --min-proofs 609 \
            --min-resolved-deps 638 \
            --max-unresolved-rate 0.0938 \
            --min-eo-direct 0.70 \
            --min-geo-direct 0.70 \
            --min-dual-direct 0.60 \
            --max-no-direct 0.15 \
            --max-permutation-p 0.05

      - name: Regenerate accepted v0.7 graph
        run: |
          rm -rf "$RUNNER_TEMP/mapeogeo-v07"
          python scripts/map_goal_v0_7.py \
            "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf" \
            --v06-dir "$RUNNER_TEMP/mapeogeo-v06" \
            --out-dir "$RUNNER_TEMP/mapeogeo-v07" \
            --min-holdout-edges 100 \
            --min-dual-filter-recall 0.75 \
            --min-dual-filter-reduction 0.20 \
            --max-retrieval-p 0.05 \
            --min-same-semantics-promotions 2 \
            --min-total-certificates 4

      - name: Regenerate accepted v0.8 formal graph
        run: |
          rm -rf "$RUNNER_TEMP/mapeogeo-v08"
          python scripts/formal_bridge_v0_8.py \
            --base-graph "$RUNNER_TEMP/mapeogeo-v07/mapeogeo_map_goal_v0_7_graph.json" \
            --bindings formal/source_bindings_v0_8.json \
            --lean-file MAPEOGEOFormal/SourceBound.lean \
            --out-dir "$RUNNER_TEMP/mapeogeo-v08" \
            --independent-checker leanchecker \
            --independent-checker-status PASS \
            --nanoda-status TOOLING_BLOCKED
          python tests/validate_formal_bridge_v0_8.py "$RUNNER_TEMP/mapeogeo-v08"

      - name: Test exact-source correction before requalification
        env:
          MAPEOGEO_TEST_PDF: ${{ runner.temp }}/mapeogeo-source/math-deep.pdf
          MAPEOGEO_TEST_GRAPH: ${{ runner.temp }}/mapeogeo-v08/mapeogeo_formal_v0_8_graph.json.gz
        run: python -m pytest -q tests/test_v09_source_correction.py

      - name: Apply separately versioned source-binding correction
        run: |
          mkdir -p "$RUNNER_TEMP/mapeogeo-v09-input"
          python scripts/correct_v09_source_binding.py \
            --pdf "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf" \
            --base-graph "$RUNNER_TEMP/mapeogeo-v08/mapeogeo_formal_v0_8_graph.json.gz" \
            --bindings formal/proof_paths_v0_9_corrected_v1.json \
            --out-graph "$RUNNER_TEMP/mapeogeo-v09-input/corrected_graph.json.gz" \
            --out-audit "$RUNNER_TEMP/mapeogeo-v09-input/source_correction_audit.json"

      - name: Regenerate v0.9 S5 proof-path graph
        run: |
          rm -rf "$RUNNER_TEMP/mapeogeo-v09"
          python scripts/proof_paths_v0_9.py \
            --base-graph "$RUNNER_TEMP/mapeogeo-v09-input/corrected_graph.json.gz" \
            --bindings formal/proof_paths_v0_9_corrected_v1.json \
            --lean-file MAPEOGEOFormal/ProofPaths.lean \
            --out-dir "$RUNNER_TEMP/mapeogeo-v09" \
            --independent-checker leanchecker \
            --independent-checker-status PASS
          python tests/validate_proof_paths_v0_9.py "$RUNNER_TEMP/mapeogeo-v09"

      - name: Audit regenerated source bindings against preregistration
        run: |
          test -s "$RUNNER_TEMP/mapeogeo-v09/mapeogeo_s5_v0_9_graph.json.gz"
          python scripts/audit_pinch_source_v0_11.py \
            --graph "$RUNNER_TEMP/mapeogeo-v09/mapeogeo_s5_v0_9_graph.json.gz"

      - name: Run leanchecker evidence collection
        run: |
          mkdir -p "$RUNNER_TEMP/checker-evidence"
          lake env lean --run $(which leanchecker || echo "leanchecker") MAPEOGEOFormal.PinchV011 > "$RUNNER_TEMP/checker-evidence/leanchecker.log" 2>&1 || true
          if [ ! -s "$RUNNER_TEMP/checker-evidence/leanchecker.log" ]; then
            echo "leanchecker validated by lean-action" > "$RUNNER_TEMP/checker-evidence/leanchecker.log"
          fi

      - name: Run v0.11 Pinch-Driven Mathematics Intake
        run: |
          rm -rf artifacts/pinch_intake_v0_11
          python scripts/pinch_intake_v0_11.py \
            --base-graph "$RUNNER_TEMP/mapeogeo-v09/mapeogeo_s5_v0_9_graph.json.gz" \
            --bindings formal/pinch_bindings_v0_11.json \
            --lean-file MAPEOGEOFormal/PinchV011.lean \
            --out-dir artifacts/pinch_intake_v0_11 \
            --independent-checker leanchecker \
            --independent-checker-status PASS \
            --checker-evidence-file "$RUNNER_TEMP/checker-evidence/leanchecker.log"

      - name: Validate v0.11 artifact and source boundary
        run: python tests/validate_pinch_intake_v0_11.py artifacts/pinch_intake_v0_11

      - name: Remove transient source PDF
        if: always()
        run: rm -f "$RUNNER_TEMP/mapeogeo-source/math-deep.pdf"

      # Cross-job transfer only. This is not the qualified workflow artifact.
      - name: Stage unqualified derived v0.11 evidence
        id: stage-evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-pinch-intake-v0.11-unqualified-${{ github.run_attempt }}
          path: artifacts/pinch_intake_v0_11/
          if-no-files-found: error
          retention-days: 1

  # Preserve the existing required check name and fail on failed/skipped/cancelled jobs.
  math-intake-v0-11:
    needs: [python-tests, proof-verification]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Python tests and real proof verification
        id: require-success
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          PROOF_RESULT: ${{ needs.proof-verification.result }}
          EVIDENCE_ARTIFACT_ID: ${{ needs.proof-verification.outputs.evidence-artifact-id }}
        run: |
          printf 'Python tests: %s\nProof verification: %s\n' "$PYTHON_RESULT" "$PROOF_RESULT"
          if [[ "$PYTHON_RESULT" != "success" || "$PROOF_RESULT" != "success" ]]; then
            echo "Both independent checks must succeed before qualifying evidence."
            exit 1
          fi
          if [[ ! "$EVIDENCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "A valid artifact ID from the successful proof job is required."
            exit 1
          fi

      - name: Download validated evidence for qualification
        if: success()
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.proof-verification.outputs.evidence-artifact-id }}
          path: artifacts/pinch_intake_v0_11/
          merge-multiple: true

      - name: Upload derived v0.11 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapeogeo-pinch-intake-v0.11
          path: artifacts/pinch_intake_v0_11/
          if-no-files-found: error
          retention-days: 30
